<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Tuition Classes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EC; --surface:#FFFFFF; --surface-2:#E7E9E0; --ink:#1A2138; --muted:#5A6077; --line:#D6D9CE;
  --accent:#2D4FB8; --accent-ink:#FFFFFF; --accent-soft:#DFE6FA;
  --good:#1E7457; --good-soft:#DAEEE5;
  --amber:#8F5E00; --amber-soft:#FBEDCC; --red:#A82B38; --red-soft:#F8DDE0;
  --rule:rgba(45,79,184,.13); --margin:rgba(168,43,56,.28);
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121522; --surface:#1B1F31; --surface-2:#262B42; --ink:#E8EAF2; --muted:#A3A9C2; --line:#33384F;
    --accent:#8DA8F5; --accent-ink:#0D1533; --accent-soft:#1E2A52;
    --good:#55C29A; --good-soft:#173A2E;
    --amber:#EDB653; --amber-soft:#3A2E14; --red:#F2838D; --red-soft:#3E1D24;
    --rule:rgba(141,168,245,.12); --margin:rgba(242,131,141,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121522; --surface:#1B1F31; --surface-2:#262B42; --ink:#E8EAF2; --muted:#A3A9C2; --line:#33384F;
  --accent:#8DA8F5; --accent-ink:#0D1533; --accent-soft:#1E2A52;
  --good:#55C29A; --good-soft:#173A2E;
  --amber:#EDB653; --amber-soft:#3A2E14; --red:#F2838D; --red-soft:#3E1D24;
  --rule:rgba(141,168,245,.12); --margin:rgba(242,131,141,.3); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 18px 60px}

/* hero: a page of ruled exercise-book paper with its red margin line */
.hero{position:relative;padding:28px 0 22px 22px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--rule) 25px 26px);pointer-events:none}
.hero::after{content:"";position:absolute;top:0;bottom:0;left:8px;width:2px;background:var(--margin);pointer-events:none}
.hero .app{position:relative;color:var(--muted);font-size:.95rem;display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap}
.hero h1{position:relative;font-size:clamp(2.3rem,8vw,4rem);font-weight:800;letter-spacing:-.025em;margin:10px 0 6px;line-height:1}
.hero .sub{position:relative;color:var(--muted)}
.back{color:var(--muted);text-decoration:none;font-weight:700}
.back:hover{color:var(--ink)}

.syncbtn{border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted);font-size:.92rem;display:inline-flex;align-items:center;gap:7px}
.syncbtn:hover{color:var(--ink)}
.syncbtn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.syncbtn[data-s="ok"] .dot{background:var(--good)}
.syncbtn[data-s="saving"] .dot,.syncbtn[data-s="loading"] .dot{background:var(--amber)}
.syncbtn[data-s="offline"] .dot,.syncbtn[data-s="error"] .dot{background:var(--red)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:700px){.cards,.cards.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.card .lbl{color:var(--muted);font-size:.88rem}
.card .big{font-family:var(--display);font-weight:700;font-size:1.35rem;line-height:1.2}
.card .act{margin-top:auto;padding-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.card .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:.92rem}
.upl{display:flex;gap:10px;align-items:baseline;color:inherit;text-decoration:none;padding:4px 0;border-top:1px solid var(--line)}
.upl:first-of-type{border-top:0}
.upl .d{font-weight:700;min-width:6.5em}
.upl .t{color:var(--muted);font-size:.92rem}
.upl .n{margin-left:auto;font-weight:700;text-align:right}
.upl:hover .n{text-decoration:underline}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:700;font-size:.92rem;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--red)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--amber-soft);color:var(--amber)}
.pill.bad{background:var(--red-soft);color:var(--red)}
.pill.subj{background:var(--accent-soft);color:var(--accent)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px;overflow-x:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:700;font-size:.85rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stu{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap;color:inherit;text-decoration:none}
.stu:first-child{border-top:0}
.stu:hover{background:var(--surface-2)}
.stu .nm{font-weight:700;min-width:170px;display:flex;flex-direction:column;line-height:1.3}
.stu .nm small{font-weight:400;color:var(--muted);font-size:.86rem}
.stu .info{flex:1;color:var(--muted);font-size:.92rem;min-width:150px}
.more{margin-top:14px}

/* class entries: collapsed by default, tap the row to open */
.lhead{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.entry+.entry{margin-top:8px}
.entry>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px}
.entry>summary::-webkit-details-marker{display:none}
.entry>summary:hover{background:var(--surface-2)}
.entry[open]>summary{border-radius:12px 12px 0 0}
.entry .tri{flex:none;width:0;height:0;border-left:8px solid var(--muted);border-top:5px solid transparent;border-bottom:5px solid transparent;transition:transform .15s}
.entry[open] .tri{transform:rotate(90deg);border-left-color:var(--accent)}
.entry .head{display:flex;flex-direction:column;min-width:0;flex:1}
.entry .when{font-family:var(--display);font-weight:700;font-size:1.08rem}
.entry .t{color:var(--muted);font-size:.9rem;font-weight:400;font-family:var(--body)}
.entry .peek{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .flags{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.entry .body{padding:4px 16px 12px 40px;border-top:1px solid var(--line)}
@media (max-width:460px){.entry .body{padding-left:16px}.entry .flags{display:none}}
.entry .txt{white-space:pre-wrap;margin-top:8px}
.entry .sub{margin-top:8px;font-size:.93rem;white-space:pre-wrap}
.entry .sub b{color:var(--muted)}
.tools{display:flex;gap:4px;margin-top:8px;margin-left:-8px}

/* study materials */
.grp{font-size:1.05rem;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.grp:first-of-type{margin-top:4px}
.grp small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.86rem}
.mat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.mat+.mat{margin-top:8px}
.mat .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mat .ttl{font-weight:700;flex:1;min-width:0}
.mat .ch{color:var(--muted);font-size:.9rem}
.mat .nt{margin-top:6px;color:var(--muted);font-size:.92rem;white-space:pre-wrap}

.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.files:empty{display:none}
.file{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;min-width:0;background:var(--surface)}
a.file:hover{background:var(--surface-2);border-color:var(--muted)}
.file .k{flex:none;font-size:.75rem;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted)}
.file .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:.92rem}
.file .sz{flex:none;color:var(--muted);font-size:.85rem}
.file .x{font-size:1.25rem;padding:0 6px}
.file.busy{border-style:dashed;color:var(--muted)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow[hidden]{display:none}
.linkrow input{flex:1 1 180px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

.fee{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.fee:first-child{border-top:0}
.fee .m{font-weight:700;min-width:140px;color:inherit;text-decoration:none}
a.m:hover{text-decoration:underline}
.fee .info{flex:1;color:var(--muted);font-size:.92rem;min-width:150px}
.total{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;color:var(--muted)}
.total strong{color:var(--ink);font-family:var(--display);font-size:1.15rem}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthnav h3{font-size:1.15rem;min-width:9.5em;text-align:center}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0}
dt{color:var(--muted)} dd{margin:0;font-weight:700;text-align:right;white-space:pre-wrap}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--muted);text-align:center}
.empty .btn{margin-top:10px}
.muted{color:var(--muted)} .small{font-size:.88rem}
.err{color:var(--red);font-size:.92rem;min-height:1.2em}

.scrim{position:fixed;inset:0;background:rgba(10,12,28,.5);z-index:50}
.modal{position:fixed;z-index:51;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 24px));max-height:calc(100% - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h2{font-size:1.15rem}
.x{border:0;background:transparent;font-size:1.5rem;cursor:pointer;color:var(--muted);line-height:1;padding:2px 8px;border-radius:6px}
.mbody{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.modal footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.grow{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:.88rem;font-weight:700}
.fld>span em{font-style:normal;font-weight:400;color:var(--muted)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;width:100%;min-width:0}
.fld textarea{resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:460px){.row{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:.86rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:80}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="grades"><option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option><option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option><option>Class 11</option><option>Class 12</option></datalist>
<datalist id="boards"><option>CBSE</option><option>ICSE</option><option>ISC</option><option>State board</option></datalist>
<script>
"use strict";
const KEY = 'my-tuition-v1';                 // local copy
const CFG_KEY = 'my-tuition-sync-v1';        // web app URL + passcode for this device
const OUT_KEY = 'my-tuition-outbox-v1';      // changes not yet saved to the sheet
const SORT_KEY = 'my-tuition-class-sort';    // newest or oldest first, per device
const SV_KEY = 'my-tuition-server-v';        // Apps Script version last seen
const MAX_FILE = 10 * 1024 * 1024;
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK = [1,2,3,4,5,6,0];                // Monday first in forms
const METHODS = ['UPI','Cash','Bank Transfer'];
const TYPES = ['Textbook','Notes','Worksheet','Question paper','Other'];
const COMMON = ['Maths','Science','Physics','Chemistry','Biology','English','Hindi','Bengali','Social Science','History','Geography','Computer','EVS'];
const EMPTY = () => ({ students:{}, classes:{}, materials:{}, fees:{} });
let S = EMPTY();
let homeTab = 'students', stuTab = 'classes', rq = '', cq = '', mq = '', subj = '', showPast = false, feeMonth = null;
const openC = new Set();                     // class entries the person has opened

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const p2 = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today = () => iso(new Date());
const thisMonth = () => today().slice(0,7);
const parseD = s => new Date(s+'T00:00:00');
const addDays = (s,n) => { const d=parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => s ? parseD(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) : '—';
const fmtDay = s => s ? parseD(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}) : '—';
const dayLabel = s => s===today() ? 'Today' : s===addDays(today(),1) ? 'Tomorrow' : fmtDay(s);
const fmtMonth = ym => new Date(ym+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const fmtTime = t => t ? new Date('1970-01-01T'+t+':00').toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}) : '';
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN');
const nextMonth = ym => { const [y,m]=ym.split('-').map(Number); return m===12 ? (y+1)+'-01' : y+'-'+p2(m+1); };
const prevMonth = ym => { const [y,m]=ym.split('-').map(Number); return m===1 ? (y-1)+'-12' : y+'-'+p2(m-1); };
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } };
const writeJSON = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const normal = d => ({ students:d?.students||{}, classes:d?.classes||{}, materials:d?.materials||{}, fees:d?.fees||{} });
const clone = o => JSON.parse(JSON.stringify(o));
const uniq = a => { const seen=new Set(); return a.filter(x=>{ const k=String(x).toLowerCase(); if(!x||seen.has(k)) return false; seen.add(k); return true; }); };
const joinList = a => a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const natural = (a,b) => String(a||'').localeCompare(String(b||''),'en',{numeric:true,sensitivity:'base'});
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2400); }
let classSort = readJSON(SORT_KEY)==='old' ? 'old' : 'new';
let serverV = Number(readJSON(SV_KEY)||0);
const setServerV = v => { serverV = Number(v||0); writeJSON(SV_KEY, serverV); };

/* ---------- local copy ---------- */
function load(){ const r=readJSON(KEY); if (r) S=normal(r); }
function save(){ writeJSON(KEY, S); }

/* ---------- Google Sheet sync ---------- */
let cfg = readJSON(CFG_KEY);                 // {url, key}
let outbox = readJSON(OUT_KEY) || [];
let sync = { state:'ok', msg:'' };
let remote = { checked:false, err:'' };
let seq = 0, flushP = null, refreshing = false;

async function api(action, data={}, c=cfg){
  let res;
  try {
    res = await fetch(c.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ ...data, action, key:c.key }) });
  } catch(e){ throw new Error('offline'); }
  let j;
  try { j = await res.json(); }
  catch(e){ const er=new Error('The web app didn’t send back data. Check it’s deployed with access for “Anyone”'); er.server=true; throw er; }
  if (!j.ok){
    const er=new Error(/^Unknown action/.test(j.error||'') ? 'Your Apps Script is out of date. Paste in the new Code.gs and deploy a new version' : (j.error||'Unknown error'));
    er.server=true; throw er;
  }
  return j;
}

function push(action, data){
  outbox.push(clone({ action, ...data }));
  seq++; writeJSON(OUT_KEY, outbox); flush();
}
function flush(){ if (!flushP) flushP = doFlush().finally(()=>{ flushP=null; }); return flushP; }
async function doFlush(){
  if (!cfg) return false;
  while (outbox.length){
    setSync('saving');
    try { await api(outbox[0].action, outbox[0]); }
    catch(e){ setSync(e.server?'error':'offline', e.server?e.message:''); return false; }
    outbox.shift(); writeJSON(OUT_KEY, outbox);
  }
  setSync('ok'); return true;
}
async function refresh(){
  if (!cfg || refreshing) return;
  refreshing = true;
  try {
    if (!(await flush())){ firstLoadFailed(); return; }
    const s0 = seq; setSync('loading');
    let j;
    try { j = await api('load'); setServerV(j.version); }
    catch(e){ setSync(e.server?'error':'offline', e.server?e.message:''); firstLoadFailed(); return; }
    if (seq !== s0 || outbox.length){ flush(); return; }
    const before = JSON.stringify(S);
    S = normal(j.data); save();
    const first = !remote.checked; remote = { checked:true, err:'' };
    setSync('ok');
    if (first || JSON.stringify(S) !== before) render();
  } finally { refreshing = false; }
}
function firstLoadFailed(){
  if (remote.checked) return;
  remote.err = sync.state==='error' ? sync.msg : 'Can’t reach the Google Sheet. Check your internet connection.';
  if (!stuList().length) render();
}
function syncText(){
  const n = outbox.length, w = n+' change'+(n===1?'':'s')+' waiting';
  switch (sync.state){
    case 'saving': return 'Saving…';
    case 'loading': return 'Checking for updates…';
    case 'offline': return 'Offline, '+w;
    case 'error': return 'Not saving to the sheet';
    default: return n ? w : 'Saved to Google Sheet';
  }
}
function setSync(state, msg=''){
  sync = { state, msg };
  const b = $('#sync');
  if (b){ b.dataset.s = state; b.querySelector('span:last-child').textContent = syncText(); }
  const p = $('#syncPanel'); if (p) p.innerHTML = syncPanelInner();

/* ---------- derived ---------- */
const stuList = () => Object.values(S.students).sort((a,b)=>String(a.name).localeCompare(String(b.name),'en',{sensitivity:'base'}));
const classesOf = id => Object.values(S.classes).filter(c=>c.studentId===id).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
const matsOf = id => Object.values(S.materials).filter(m=>m.studentId===id)
  .sort((a,b)=>natural(a.subject,b.subject) || natural(a.chapter,b.chapter) || TYPES.indexOf(a.type)-TYPES.indexOf(b.type) || natural(matTitle(a),matTitle(b)));
const daysOf = st => (Array.isArray(st.days) ? st.days : String(st.days??'').split(',')).filter(x=>x!==''&&x!=null).map(Number);
const subjectsOf = st => uniq(String(st.subjects||'').split(',').map(x=>x.trim()));
const usedSubjects = st => uniq([...subjectsOf(st), ...classesOf(st.id).map(c=>c.subject), ...matsOf(st.id).map(m=>m.subject)].map(x=>String(x||'').trim()));
const matTitle = m => m.title || (m.files&&m.files[0]&&m.files[0].name) || m.type || 'Material';
const hasClassOn = (id,d) => Object.values(S.classes).some(c=>c.studentId===id && c.date===d);
function nextClass(st){
  if (!st || st.leftDate) return null;
  const t = today(), days = daysOf(st);
  if (st.next && st.next.date >= t && !hasClassOn(st.id, st.next.date)) return {...st.next, custom:true};
  if (!days.length) return null;
  for (let i=0;i<8;i++){ const d=addDays(t,i); if (days.includes(parseD(d).getDay()) && !hasClassOn(st.id,d)) return {date:d, time:st.time, custom:false}; }
  return null;
}
const endMonth = st => { const t=thisMonth(); return st.leftDate && st.leftDate.slice(0,7)<t ? st.leftDate.slice(0,7) : t; };
const inMonth = (st,m) => (st.joinDate||today()).slice(0,7)<=m && (!st.leftDate || st.leftDate.slice(0,7)>=m);
function monthsOf(st){
  const out=[]; let m=(st.joinDate||today()).slice(0,7); const end=endMonth(st);
  while (m<=end && out.length<240){ out.push(m); m=nextMonth(m); }
  return out.reverse();
}
const fk = (id,m) => id+'_'+m;
function feeInfo(st,m){
  const r=S.fees[fk(st.id,m)]||{}, due=Number(r.due ?? st.fee ?? 0), paid=Number(r.amount||0);
  const status = paid>=due && due>0 ? 'Paid' : paid>0 ? 'Part paid' : 'Not paid';
  return {...r, month:m, due, paid, bal:Math.max(0,due-paid), status};
}
const pendingOf = st => monthsOf(st).reduce((s,m)=>s+feeInfo(st,m).bal,0);
const tone = s => s==='Paid'?'good':s==='Part paid'?'warn':'bad';
const daysText = st => { const d=daysOf(st); return d.length===7 ? 'Every day' : joinList(WEEK.filter(x=>d.includes(x)).map(x=>SHORT[x])); };
const usual = st => daysOf(st).length ? daysText(st)+(st.time?' at '+fmtTime(st.time):'') : 'No fixed days';
const gradeLine = st => [st.grade, st.board].filter(Boolean).join(', ');

const readB64 = file => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]||''); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(file); });
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '#';
const kindOf = f => f.kind==='link' ? (/youtu\.?be/i.test(f.url)?'YouTube':'Link')
  : /pdf/i.test(f.mime)?'PDF' : /^image/i.test(f.mime)?'Photo' : /^audio/i.test(f.mime)?'Audio' : /^video/i.test(f.mime)?'Video' : 'File';
const fsize = n => !n ? '' : n<1048576 ? Math.max(1,Math.round(n/1024))+' KB' : (n/1048576).toFixed(1)+' MB';
function linkName(u){ if (/youtu\.?be/i.test(u)) return 'YouTube video'; try { return new URL(u).hostname.replace(/^www\./,''); } catch(e){ return 'Link'; } }
function fileRow(f, edit){
  const inner = `<span class="k">${kindOf(f)}</span><span class="fn">${esc(f.name)}</span>${f.size?`<span class="sz">${fsize(f.size)}</span>`:''}`;
  return edit ? `<div class="file">${inner}<button type="button" class="x" data-rm="${esc(f.id)}" aria-label="Remove ${esc(f.name)}">×</button></div>`
    : `<a class="file" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">${inner}</a>`;
}
const filesHTML = files => files&&files.length ? `<div class="files">${files.map(f=>fileRow(f)).join('')}</div>` : '';
function attachHTML(label){
  return `<div class="fld"><span>${label}</span>
    ${serverV>=1 ? `<div class="files" id="flist"></div>
    <div class="btns"><label class="btn sm" style="cursor:pointer">Attach file<input type="file" id="fpick" multiple hidden></label>
      <button type="button" class="btn sm" id="linkbtn">Add a link</button></div>
    <div class="linkrow" id="linkrow" hidden><input type="url" id="lurl" placeholder="Paste a YouTube or Drive link" aria-label="Link"><input id="lname" placeholder="Name (optional)" aria-label="Link name"><button type="button" class="btn sm primary" id="ladd">Add</button></div>
    <p class="hint">Files go to the “My Tuition Files” folder in your Google Drive, up to 10 MB each. For a bigger textbook PDF, put it in Drive yourself and add its link.</p>`
    : `<p class="hint">Connect to your Google Sheet to attach files and links.</p>`}</div>`;
}
/* Wires up the attach controls in the open form. Files uploaded and then cancelled are cleaned up. */
function attachWire(st, orig){
  let files = orig.slice(), fresh = [], up = [], gone = false;
  const ctl = { files:()=>files, busy:()=>up.length>0,
    cancel(){ gone=true; fresh.forEach(f=>push('delFile',{fileId:f.id})); },
    commit(){ const keep=new Set(files.map(f=>f.id)); orig.concat(fresh).forEach(f=>{ if (f.kind==='drive' && !keep.has(f.id)) push('delFile',{fileId:f.id}); }); gone=true; return files; } };
  if (!$('#flist')) return ctl;
  const draw = () => { const l=$('#flist'); if (!l || gone) return;
    l.innerHTML = files.map(f=>fileRow(f,true)).join('') + up.map(n=>`<div class="file busy"><span class="k">…</span><span class="fn">Uploading ${esc(n)}</span></div>`).join(''); };
  draw();
  $('#flist').onclick = e => { const b=e.target.closest('[data-rm]'); if (!b) return; files = files.filter(f=>f.id!==b.dataset.rm); draw(); };
  $('#fpick').onchange = e => {
    [...e.target.files].forEach(async file => {
      if (file.size > MAX_FILE){ toast(file.name+' is over 10 MB. Add it to Drive and use “Add a link”.'); return; }
      up.push(file.name); draw();
      try {
        const sj = ($('#mf [name="subject"]')||{}).value || '';
        const j = await api('upload', {studentId:st.id, subject:sj.trim(), name:file.name, mime:file.type||'application/octet-stream', data:await readB64(file)});
        if (gone){ push('delFile',{fileId:j.file.id}); return; }
        files.push(j.file); fresh.push(j.file);
      } catch(ex){ toast(ex.server ? ex.message : 'Couldn’t upload '+file.name+'. Check your internet connection.'); }
      finally { up.splice(up.indexOf(file.name),1); draw(); }
    });
    e.target.value = '';
  };
  const row=$('#linkrow'), lu=$('#lurl'), ln=$('#lname');
  $('#linkbtn').onclick = () => { row.hidden = false; lu.focus(); };
  const addLink = () => {
    const u = lu.value.trim();
    if (!/^https?:\/\/\S+$/i.test(u)){ toast('Paste a full link starting with https://'); lu.focus(); return; }
    files.push({id:uid(), kind:'link', name:ln.value.trim()||linkName(u), url:u});
    lu.value=''; ln.value=''; row.hidden=true; draw();
  };
  $('#ladd').onclick = addLink;
  [lu,ln].forEach(i=>i.onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); addLink(); } });
  return ctl;
}

async function connect(e){
  e.preventDefault();
  const v = Object.fromEntries(new FormData(e.target)), url = v.url.trim(), key = v.key;
  const err = $('#cerr'), btn = $('#cbtn');
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){ err.textContent='Paste the Web app URL from Apps Script. It starts with https://script.google.com and ends with /exec.'; return; }
  if (!key){ err.textContent='Enter the passcode you set in Apps Script.'; return; }
  btn.disabled = true; btn.textContent = 'Connecting…'; err.textContent = '';
  try {
    const j = await api('load', {}, {url, key});
    if (j.data && !('materials' in j.data)) { const er=new Error('That URL belongs to a different app (it looks like the music one). Use the web app URL from your tuition Sheet'); er.server=true; throw er; }
    cfg = {url, key}; writeJSON(CFG_KEY, cfg); setServerV(j.version);
    const d = normal(j.data);
    if (!Object.keys(d.students).length && stuList().length){
      outbox = [clone({action:'replaceAll', data:S})]; writeJSON(OUT_KEY, outbox);
      await flush(); toast('Your records were copied to the Google Sheet');
    } else { S = d; save(); toast('Connected'); }
    remote = {checked:true, err:''}; render();
  } catch(ex){

    btn.disabled = false; btn.textContent = 'Connect';
  }
}

function rosterHTML(){
  const all = stuList(), act = all.filter(s=>!s.leftDate), past = all.filter(s=>s.leftDate);

/* ---------- render ---------- */
function render(){
  load.done || (load(), load.done=true);
  const app=$('#app');
  if (!cfg){ app.innerHTML=viewConnect(); $('#cf').onsubmit=connect; return; }
  if (!stuList().length && !remote.checked){ app.innerHTML=viewLoading(); return; }
  const st = route();
  if (!st && location.hash.startsWith('#student-')) history.replaceState(null,'',location.pathname+location.search);
  app.innerHTML = st ? viewStudent(st) : viewHome();
  const r=$('#rq'); if (r) r.oninput = e => { rq=e.target.value; $('#roster').innerHTML=rosterHTML(); };
  const c=$('#cq'); if (c) c.oninput = e => { cq=e.target.value; drawList(st); };
  const m=$('#mq'); if (m) m.oninput = e => { mq=e.target.value; $('#mlist').innerHTML=matsHTML(st); };
  const imp=$('#imp'); if (imp) imp.onchange = restore;
}

/* ---------- actions ---------- */
const stu = d => S.students[d.id];
const A = {
  close,
  home: d => { homeTab=d.id; render(); },
  stab: d => { stuTab=d.id; render(); },
  subj: d => { subj=d.id; render(); },
  month: d => { feeMonth=d.id; render(); },
  togglePast: () => { showPast=!showPast; $('#roster').innerHTML=rosterHTML(); },
  sortClasses: d => { classSort = classSort==='old' ? 'new' : 'old'; writeJSON(SORT_KEY, classSort); drawList(stu(d)); },
  expandAll: d => {
    const ids = classFilter(classesOf(d.id)).map(c=>c.id);
    if (ids.every(id=>openC.has(id))) ids.forEach(id=>openC.delete(id)); else ids.forEach(id=>openC.add(id));
    drawList(stu(d));
  },
  addStudent: () => studentForm(null),
  editStudent: d => studentForm(stu(d)),
  left: d => leftForm(stu(d)),
  rejoin: d => { putStudent({...stu(d), leftDate:''}); toast('Back in current students'); render(); },
  delStudent: d => {
    const st=stu(d), nc=classesOf(st.id).length, nm=matsOf(st.id).length;
    confirmBox(`Delete <b>${esc(st.name)}</b>${nc?`, their ${nc} class record${nc===1?'':'s'}`:''}${nm?`, ${nm} study material${nm===1?'':'s'}`:''} and fee records? This can’t be undone. Files stay in your Drive folder. If they’ve just stopped coming, use “Student has left” instead.`, 'Delete student', ()=>{
      Object.values(S.classes).forEach(c=>{ if(c.studentId===st.id) delete S.classes[c.id]; });
      Object.values(S.materials).forEach(m=>{ if(m.studentId===st.id) delete S.materials[m.id]; });
      Object.values(S.fees).forEach(f=>{ if(f.studentId===st.id) delete S.fees[f.id]; });
      delete S.students[st.id]; save(); push('delStudent', {id:st.id}); toast(st.name+' deleted'); location.hash='';
    });
  },
  addClass: d => classForm(stu(d), null),
  editClass: d => { const c=S.classes[d.id]; classForm(S.students[c.studentId], c); },
  delClass: d => { close(); confirmBox('Delete this class record? Its files stay in your Drive folder.', 'Delete', ()=>{ delete S.classes[d.id]; openC.delete(d.id); save(); push('delClass', {id:d.id}); toast('Class deleted'); render(); }); },
  addMat: d => materialForm(stu(d), null),
  editMat: d => { const m=S.materials[d.id]; materialForm(S.students[m.studentId], m); },
  delMat: d => { close(); confirmBox('Delete this study material? Its files stay in your Drive folder.', 'Delete', ()=>{ delete S.materials[d.id]; save(); push('delMaterial', {id:d.id}); toast('Material deleted'); render(); }); },
  next: d => nextForm(stu(d)),
  resetNext: d => { putStudent({...stu(d), next:null}); close(); toast('Back to the usual days'); render(); },
  fee: d => feeForm(stu(d), d.m),
  unpay: d => { const f=S.fees[d.id]; close(); confirmBox('Mark '+fmtMonth(f.month)+' as not paid?', 'Mark not paid', ()=>{ delete S.fees[d.id]; save(); push('delFee', {id:d.id}); render(); }); },
  sync: () => {
    if (sync.state==='error'){
      openModal({title:'Not saving to the sheet', body:`<p>${esc(sync.msg)}.</p><p class="hint" style="margin-top:8px">Your changes are kept on this device and will be sent once this is fixed.</p>`,
        left:`<button type="button" class="btn" data-act="syncNow">Try again</button>`});
    } else { refresh(); }
  },
  syncNow: () => { close(); toast('Syncing…'); refresh(); },
  retry: () => { remote.err=''; render(); refresh(); },
  disconnect: () => {
    const n = outbox.length;
    confirmBox('Disconnect this device? Your records stay in the Google Sheet.'+(n?` <b>${n} change${n===1?'':'s'} not yet saved to the sheet will be lost.</b>`:''), 'Disconnect', ()=>{
      cfg=null; writeJSON(CFG_KEY, null); outbox=[]; writeJSON(OUT_KEY, outbox);
      S=EMPTY(); save(); remote={checked:false, err:''}; setSync('ok'); location.hash=''; render();
    });
  },
  export: () => {
    const blob=new Blob([JSON.stringify({app:'my-tuition', version:1, ...S},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tuition-backup-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); toast('Backup downloaded');
  }
};
function restore(e){
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{ let d; try{ d=JSON.parse(r.result); }catch(err){ toast('That file isn’t a backup'); return; }
    if (!d || d.app!=='my-tuition'){ toast(d && /^my-music-studio/.test(d.app||'') ? 'That’s a music studio backup. Restore it in the music app.' : 'That file isn’t a tuition backup'); return; }
    const data = normal(d);
    confirmBox('Replace everything in the Google Sheet with this backup?', 'Restore', ()=>{ S=data; save(); push('replaceAll', {data:S}); toast('Backup restored'); location.hash=''; render(); }); };
  r.readAsText(file); e.target.value='';
}
document.addEventListener('click', e => { const el=e.target.closest('[data-act]'); if(!el||!A[el.dataset.act]) return; e.preventDefault(); A[el.dataset.act](el.dataset); });

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
window.addEventListener('online', refresh);
setInterval(() => { if (!document.hidden) refresh(); }, 60000);

render();
refresh();
</script>
</body>
